[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recon-engine"
version = "0.1.0"
description = "Deterministic, scope-aware reconnaissance engine with evidence integrity for authorized assessments."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Alex M. Mulinge", email = "mulingealex68@gmail.com" },
]
keywords = [
  "reconnaissance",
  "cybersecurity",
  "vapt",
  "ethical-hacking",
  "evidence",
  "attack-surface",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/mulingealex/recon-engine-portfolio"
Documentation = "https://github.com/mulingealex/recon-engine-portfolio/tree/master/docs"
Repository = "https://github.com/mulingealex/recon-engine-portfolio"
Issues = "https://github.com/mulingealex/recon-engine-portfolio/issues"
Changelog = "https://github.com/mulingealex/recon-engine-portfolio/blob/master/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "black>=24.0",
  "mypy>=1.10",
]

[project.scripts]
recon = "recon.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
